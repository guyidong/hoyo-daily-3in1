# 三游戏每日一条龙 · 目标配置（复制为 daily_config.yaml 使用）
scheduler:
  enabled: true
  run_order: [genshin, starrail, zzz]   # 依次运行顺序

# 工具路径（可选）：不填则使用 <项目根>/tools/... 默认约定
# tools:
#   bettergi_dir: "D:/daily/tools/BetterGI/BetterGI"
#   march7th_dir: "D:/daily/tools/March7thAssistant"
#   one_dragon_dir: "D:/daily/OneDragon-ref"
# proxy: "http://127.0.0.1:7890"        # 可选：下载/更新走代理时填写

games:
  genshin:
    enabled: true
    name: "原神"
    client_path: "YOUR_PATH/YuanShen.exe"      # 例：D:/Genshin Impact Game/YuanShen.exe
    party_name: "你的队伍名"                    # 打秘境用的队伍
    display: { auto_switch_window: true, auto_width: 1920, auto_height: 1080 }
    targets:
      - { name: "山风的荆冕", runs: 0, enabled: true }   # runs=0 表示清空树脂

  starrail:
    enabled: true
    name: "崩坏：星穹铁道"
    client_path: "YOUR_PATH/StarRail.exe"      # 例：F:/Star Rail Game/StarRail.exe
    display: { auto_switch_window: true, auto_width: 1920, auto_height: 1080 }
    targets:
      - { name: "侵蚀隧洞", mission_name: "观火之径", runs: 5, enabled: true }

  zzz:
    enabled: true
    name: "绝区零"
    client_path: "YOUR_PATH/ZenlessZoneZero.exe"   # 例：D:/ZenlessZoneZero Game/ZenlessZoneZero.exe
    display: { auto_switch_window: true, auto_width: 1920, auto_height: 1080 }
    targets:
      - { category: "实战模拟室", mission_type: "迅雷与裂爪", mission_name: "谶羽之誓 荆棘玫瑰", runs: 4, enabled: true }
