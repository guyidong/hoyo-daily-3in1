# ============================================================
# 三游戏每日一条龙 · 目标配置
# 首次运行会自动复制本文件为 daily_config.yaml（真正生效的是它）
# 也可以直接双击 panel.bat 用面板改，改完点保存。
# ============================================================

# 总控
scheduler:
  enabled: true
  daily_time: "07:30"                    # 建议的每日时间（真正的定时由面板“保存定时”写入系统计划任务）
  run_order: [genshin, starrail, zzz]    # 依次运行顺序
  timeout_minutes: 120                   # 单次总超时，防止卡死

# 可选：工具路径。默认 <项目根>/tools/... 与 <项目根>/OneDragon-ref
# 也可用环境变量 HOYO_BETTERGI_DIR / HOYO_MARCH7TH_DIR / HOYO_ONEDRAGON_DIR 覆盖
# tools:
#   bettergi_dir: "tools/BetterGI/BetterGI"
#   march7th_dir: "tools/March7thAssistant"
#   one_dragon_dir: "OneDragon-ref"
# proxy: "http://127.0.0.1:7890"         # 可选：下载更新 / 引擎联网走代理

games:
  genshin:
    enabled: true
    name: "原神"
    client_path: "D:/Genshin Impact Game/YuanShen.exe"   # 改成你的实际路径（正斜杠）
    party_name: "你的队伍名"                             # 打秘境用的队伍
    display: { auto_switch_window: true, auto_width: 1920, auto_height: 1080 }
    targets:
      # days = 只在哪些天打（支持 "周五~周日" / ["Friday","周六"]）；不写 = 每天
      - { name: "逆悬的冰河", runs: 0, enabled: true, days: "周五~周日" }   # 圣遗物本（runs=0 清空树脂）
      # switch_only: true = 只是"开不开某个一条龙任务"的开关，不是秘境，不会多跑一趟
      - { name: "地脉花",   enabled: true, switch_only: true, days: "周一~周四" }
      # enabled 可以写 ui：表示这个任务的开关完全听 BetterGI 界面的（推荐，界面里勾/取消都算数）
      - { name: "幽境危战", enabled: ui,   switch_only: true }
      # 优先级：BetterGI 界面 > 本文件。界面里填过的（队伍名/默认秘境/每周秘境/地脉花国家…）不会被覆盖；
      # 只有本文件显式声明的（上面的 days、enabled: true/false）才由程序写进一条龙。

  starrail:
    enabled: true
    name: "崩坏：星穹铁道"
    client_path: "F:/Star Rail Game/StarRail.exe"        # 改成你的实际路径
    display: { auto_switch_window: true, auto_width: 1920, auto_height: 1080 }
    targets:
      # [副本类型, 实例名, 次数]；runs=0 表示清空开拓力
      - { name: "侵蚀隧洞", mission_name: "观火之径", runs: 5, enabled: true }

  zzz:
    enabled: true
    name: "绝区零"
    client_path: "D:/ZenlessZoneZero Game/ZenlessZoneZero.exe"
    display: { auto_switch_window: true, auto_width: 1920, auto_height: 1080 }
    targets:
      - { category: "实战模拟室", mission_type: "迅雷与裂爪", mission_name: "谶羽之誓 荆棘玫瑰", runs: 4, enabled: true }
